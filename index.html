<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="signup-container">

        <div class="welcome">
            <h1>↪</h1>
            <h2>Welcome Back!</h2>
            <p>To keep connected with us please login<br>
                with your personal info</p>

            <a href="login.html" class="login-btn">← LOG IN</a>
        </div>

        <div class="signup-form">
            <h1>Sign Up</h1>

            <div class="social">
                <i class="fa-brands fa-facebook-f"></i>
                <i class="fa-brands fa-twitter"></i>
                <i class="fa-brands fa-github"></i>
                <i class="fa-brands fa-linkedin-in"></i>
            </div>

            <div class="or">
                <hr>
                <span>OR</span>
                <hr>
            </div>

            <form>
                <input id="inp" type="text" placeholder="name">
                <input id="inp" type="email" placeholder="email">
                <input id="inp" type="password" placeholder="password">

                <label>
                    <input type="checkbox">
                    I accept terms
                </label>

                <button type="submit">REGISTER</button>
            </form>

            <p class="mobile-login">
                Already have an account?
                <a href="login.html">Login</a>
            </p>
        </div>

    </div>

</body>

</html>
